[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ueh-portal"
version = "0.1.0"
description = "UEH Publishing Portal V2 — Nền tảng M0 (Nhà xuất bản Kinh tế TP.HCM)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
    "django-allauth[socialaccount]>=65.3",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["apps*", "portal*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "portal.settings.dev"
python_files = ["tests/test_*.py", "test_*.py"]
addopts = "--cov=apps --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "portal", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
