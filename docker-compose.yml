services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ueh_portal
      POSTGRES_USER: ueh_portal
      POSTGRES_PASSWORD: ueh_portal_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ueh_portal -d ueh_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: portal.settings.dev
      DJANGO_SECRET_KEY: dev-insecure-change-in-production
      DJANGO_DEBUG: "True"
      DATABASE_URL: postgres://ueh_portal:ueh_portal_dev_password@db:5432/ueh_portal
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      STAFF_GOOGLE_DOMAIN: ueh.edu.vn
      BOOTSTRAP_ADMIN_EMAILS: admin@ueh.edu.vn
      FILE_STORAGE_BACKEND: local
      MEDIA_ROOT: /app/media
      MAX_FILE_MB: "200"
      EMAIL_URL: smtp://mailpit:1025
      PORT: "8000"
    volumes:
      - .:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres_data:
  media_data:
