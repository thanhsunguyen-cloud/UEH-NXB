{% extends "public_site/_layout.html" %}
{% block public_content %}
<h1 class="h3 fw-bold mb-3">Tin tức</h1>
{% if posts %}
  <div class="row g-3">
    {% for post in posts %}
      <div class="col-12 col-md-6 col-lg-4">{% include "public_site/_news_card.html" %}</div>
    {% endfor %}
  </div>
  {% include "partials/pagination.html" %}
{% else %}
  <p class="text-muted">Chưa có tin tức.</p>
{% endif %}
{% endblock %}
